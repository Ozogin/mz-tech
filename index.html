<script>
(function () {
    'use strict';

    /* ================== ЭЛЕМЕНТЫ ================== */
    var el = {
        clock: document.getElementById('realtime-clock-digital-display'),
        themeToggle: document.getElementById('theme-toggle'),
        themeIcon: document.getElementById('theme-icon'),
        themeLabel: document.getElementById('theme-label'),
        ytBtn: document.getElementById('master-audio-engine-activation-button'),
        synthToggle: document.getElementById('synth-toggle'),
        ytOverlay: document.getElementById('yt-overlay'),
        ytClose: document.getElementById('yt-close'),
        ytContainer: document.getElementById('yt-player-container'),
        pumpkin: document.getElementById('pumpkin'),
        area: document.getElementById('game-area'),
        score: document.getElementById('runtime-score-counter'),
        timer: document.getElementById('game-timer-display'),
        best: document.getElementById('historical-best-counter'),
        combo: document.getElementById('combo-display'),
        startBtn: document.getElementById('game-start-trigger'),
        stopBtn: document.getElementById('game-stop-trigger'),
        a1: document.getElementById('achievement-slot-1'),
        a2: document.getElementById('achievement-slot-2'),
        a3: document.getElementById('achievement-slot-3')
    };

    /* ================== СОСТОЯНИЕ ================== */
    var totalSystemSecondsCounter = 0;
    var gameLoop = null;
    var timerLoop = null;
    var specialTimeout = null;
    var isSystemGameActive = false;
    var score = 0;
    var best = 0;
    var timerLeft = 30;
    var combo = { count: 0, max: 0, lastClick: 0 };
    var themeMode = 'pumpkin';
    var pumpkinState = 'normal';

    try {
        var savedBest = localStorage.getItem('mz_halloween_best');
        if (savedBest) best = parseInt(savedBest, 10) || 0;
    } catch (e) {}
    if (el.best) el.best.innerText = best;

    /* ================== ПАУТИНЫ ================== */
    var web = document.querySelector('.site-spider-web-top-left');
    if (web) {
        var webHTML = web.innerHTML;
        var tr = document.querySelector('.site-spider-web-top-right');
        var bl = document.querySelector('.site-spider-web-bottom-left');
        var br = document.querySelector('.site-spider-web-bottom-right');
        if (tr) tr.innerHTML = webHTML;
        if (bl) bl.innerHTML = webHTML;
        if (br) br.innerHTML = webHTML;
    }

    /* ================== ЧАСЫ ================== */
    setInterval(function () {
        totalSystemSecondsCounter++;
        var h = Math.floor(totalSystemSecondsCounter / 3600);
        var m = Math.floor((totalSystemSecondsCounter % 3600) / 60);
        var s = totalSystemSecondsCounter % 60;
        if (el.clock) el.clock.innerText = h + 'ч ' + m + 'мин ' + s + 'сек';
    }, 1000);

    /* ================== ТЕМЫ ================== */
    if (el.themeToggle) {
        el.themeToggle.addEventListener('click', function () {
            themeMode = (themeMode === 'pumpkin') ? 'samhain' : 'pumpkin';
            if (themeMode === 'samhain') {
                document.body.classList.add('theme-samhain');
                if (el.themeIcon) el.themeIcon.textContent = '🌿';
                if (el.themeLabel) el.themeLabel.textContent = 'Тема: Самайн';
            } else {
                document.body.classList.remove('theme-samhain');
                if (el.themeIcon) el.themeIcon.textContent = '🎃';
                if (el.themeLabel) el.themeLabel.textContent = 'Тема: Тыква';
            }
        });
    }

    /* ================== СИНТЕЗ-ЭМБИЕНТ ================== */
    var Audio = {
        ctx: null,
        interval: null,
        isOn: false,
        notes: [146.83, 174.61, 220.00, 261.63, 174.61, 146.83, 116.54, 146.83],
        bells: [880, 1174.66, 1046.50],
        idx: 0,
        bellIdx: 0,

        ensure: function () {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) { return false; }
            }
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
            return true;
        },

        step: function () {
            if (!this.ctx || !this.isOn) return;
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
            var t = this.ctx.currentTime;

            var osc = this.ctx.createOscillator();
            var g = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(this.notes[this.idx], t);
            osc.frequency.linearRampToValueAtTime(this.notes[this.idx] * 0.985, t + 2.4);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.linearRampToValueAtTime(0.16, t + 0.4);
            g.gain.linearRampToValueAtTime(0.0001, t + 2.6);
            osc.connect(g); g.connect(this.ctx.destination);
            osc.start(t); osc.stop(t + 2.7);

            if (this.idx % 3 === 0) {
                var bell = this.ctx.createOscillator();
                var bg = this.ctx.createGain();
                bell.type = 'sine';
                bell.frequency.setValueAtTime(this.bells[this.bellIdx % this.bells.length], t + 0.2);
                bg.gain.setValueAtTime(0.0001, t + 0.2);
                bg.gain.linearRampToValueAtTime(0.08, t + 0.25);
                bg.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
                bell.connect(bg); bg.connect(this.ctx.destination);
                bell.start(t + 0.2); bell.stop(t + 1.7);
                this.bellIdx++;
            }
            this.idx = (this.idx + 1) % this.notes.length;
        },

        start: function () {
            if (!this.ensure()) return;
            if (this.interval) return;
            this.isOn = true;
            var self = this;
            this.step();
            this.interval = setInterval(function () { self.step(); }, 1400);
        },

        stop: function () {
            this.isOn = false;
            if (this.interval) { clearInterval(this.interval); this.interval = null; }
        },

        blip: function (type, f1, f2, vol) {
            if (!this.ctx || !this.isOn) return;
            if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
            try {
                var t = this.ctx.currentTime;
                var o = this.ctx.createOscillator();
                var g = this.ctx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(f1, t);
                o.frequency.exponentialRampToValueAtTime(f2, t + 0.18);
                g.gain.setValueAtTime(vol, t);
                g.gain.linearRampToValueAtTime(0.001, t + 0.2);
                o.connect(g); g.connect(this.ctx.destination);
                o.start(t); o.stop(t + 0.22);
            } catch (e) {}
        },
        catchSound: function () { this.blip('square', 600, 120, 0.15); },
        bonusSound: function () { this.blip('sine', 880, 1320, 0.12); },
        cursedSound: function () { this.blip('sawtooth', 200, 50, 0.16); }
    };

    if (el.synthToggle) {
        el.synthToggle.addEventListener('click', function () {
            if (Audio.isOn) {
                Audio.stop();
                el.synthToggle.classList.remove('active');
                el.synthToggle.textContent = '🔮 Синтез-эмбиент: выкл';
            } else {
                Audio.start();
                if (Audio.isOn) {
                    el.synthToggle.classList.add('active');
                    el.synthToggle.textContent = '🔮 Синтез-эмбиент: вкл';
                }
            }
        });
    }

    /* ================== YOUTUBE ================== */
    var ytIframe = null;
    var YT_ID = 'RaDa7m76uXY';

    function openYT() {
        if (!el.ytOverlay) return;
        el.ytOverlay.classList.add('open');
        if (!ytIframe && el.ytContainer) {
            ytIframe = document.createElement('iframe');
            ytIframe.src = 'https://www.youtube.com/embed/' + YT_ID + '?autoplay=1&rel=0&modestbranding=1';
            ytIframe.allow = 'autoplay; encrypted-media; picture-in-picture';
            ytIframe.allowFullscreen = true;
            ytIframe.title = 'Хэллоуинская музыка';
            el.ytContainer.appendChild(ytIframe);
        }
    }
    function closeYT() {
        if (!el.ytOverlay) return;
        el.ytOverlay.classList.remove('open');
        if (ytIframe) { ytIframe.remove(); ytIframe = null; }
    }
    if (el.ytBtn) el.ytBtn.addEventListener('click', openYT);
    if (el.ytClose) el.ytClose.addEventListener('click', closeYT);
    if (el.ytOverlay) {
        el.ytOverlay.addEventListener('click', function (e) {
            if (e.target === el.ytOverlay) closeYT();
        });
    }

    /* ================== ИГРА ================== */
    function areaSize() {
        if (!el.area) return { w: 300, h: 150 };
        return {
            w: Math.max(10, el.area.clientWidth - 50),
            h: Math.max(10, el.area.clientHeight - 50)
        };
    }

    function movePumpkin() {
        if (!isSystemGameActive || !el.pumpkin) return;
        var s = areaSize();
        el.pumpkin.style.left = Math.floor(Math.random() * s.w) + 'px';
        el.pumpkin.style.top = Math.floor(Math.random() * s.h) + 'px';
    }

    function setPumpkinState(state) {
        pumpkinState = state;
        if (!el.pumpkin) return;
        el.pumpkin.classList.remove('bonus', 'cursed');
        if (state === 'bonus') { el.pumpkin.classList.add('bonus'); el.pumpkin.textContent = '🕷️'; }
        else if (state === 'cursed') { el.pumpkin.classList.add('cursed'); el.pumpkin.textContent = '👿'; }
        else { el.pumpkin.textContent = '🎃'; }
    }

    function scheduleSpecial() {
        clearTimeout(specialTimeout);
        if (!isSystemGameActive) return;
        var delay = 2500 + Math.random() * 3000;
        specialTimeout = setTimeout(function () {
            if (!isSystemGameActive) return;
            var roll = Math.random();
            if (roll < 0.35) setPumpkinState('bonus');
            else if (roll < 0.55) setPumpkinState('cursed');
            else setPumpkinState('normal');
            scheduleSpecial();
        }, delay);
    }

    function resetPumpkinPosition() {
        if (!el.pumpkin) return;
        el.pumpkin.style.left = '45%';
        el.pumpkin.style.top = '35%';
    }

    function updateScoreUI() {
        if (el.score) el.score.innerText = score;
        if (score > best) {
            best = score;
            if (el.best) el.best.innerText = best;
            try { localStorage.setItem('mz_halloween_best', best); } catch (e) {}
        }
    }

    function evaluateAchievements() {
        if (score >= 10 && el.a1) { el.a1.innerText = '🏆 Охотник за призраками (Получено!)'; el.a1.className = 'ach-item unlocked'; }
        if (score >= 25 && el.a2) { el.a2.innerText = '🏆 Повелитель тыкв (Получено!)'; el.a2.className = 'ach-item unlocked'; }
        if (combo.max >= 5 && el.a3) { el.a3.innerText = '🏆 Комбо-мастер (Получено!)'; el.a3.className = 'ach-item unlocked'; }
    }

    function updateComboUI() {
        if (!el.combo) return;
        if (combo.count >= 2) {
            el.combo.textContent = 'Комбо x' + combo.count + '!';
            el.combo.classList.add('visible');
        } else {
            el.combo.classList.remove('visible');
        }
    }

    function registerClick() {
        var now = Date.now();
        if (now - combo.lastClick < 900) combo.count++;
        else combo.count = 1;
        combo.lastClick = now;
        if (combo.count > combo.max) combo.max = combo.count;
        updateComboUI();
    }

    function resetGameUI() {
        score = 0;
        timerLeft = 30;
        combo = { count: 0, max: 0, lastClick: 0 };
        if (el.score) el.score.innerText = '0';
        if (el.timer) el.timer.innerText = '30';
        if (el.combo) { el.combo.textContent = ''; el.combo.classList.remove('visible'); }
        if (el.a1) { el.a1.innerText = '❌ Охотник за призраками (10 очков)'; el.a1.className = 'ach-item'; }
        if (el.a2) { el.a2.innerText = '❌ Повелитель тыкв (25 очков)'; el.a2.className = 'ach-item'; }
        if (el.a3) { el.a3.innerText = '❌ Комбо-мастер (x5 комбо)'; el.a3.className = 'ach-item'; }
    }

    function stopGame() {
        isSystemGameActive = false;
        if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
        if (timerLoop) { clearInterval(timerLoop); timerLoop = null; }
        clearTimeout(specialTimeout);
        specialTimeout = null;
        setPumpkinState('normal');
        resetPumpkinPosition();
    }

    function startGame() {
        stopGame();
        resetGameUI();
        isSystemGameActive = true;
        setPumpkinState('normal');
        movePumpkin();
        gameLoop = setInterval(movePumpkin, 750);
        timerLoop = setInterval(function () {
            timerLeft--;
            if (el.timer) el.timer.innerText = timerLeft;
            if (timerLeft <= 0) {
                stopGame();
                evaluateAchievements();
            }
        }, 1000);
        scheduleSpecial();
    }

    if (el.startBtn) el.startBtn.addEventListener('click', startGame);
    if (el.stopBtn) el.stopBtn.addEventListener('click', stopGame);

    if (el.pumpkin) {
        el.pumpkin.addEventListener('click', function () {
            if (!isSystemGameActive) return;
            registerClick();
            if (pumpkinState === 'bonus') {
                score += 3;
                Audio.bonusSound();
                setPumpkinState('normal');
            } else if (pumpkinState === 'cursed') {
                score = Math.max(0, score - 2);
                Audio.cursedSound();
                setPumpkinState('normal');
            } else {
                score += 1;
                Audio.catchSound();
            }
            updateScoreUI();
            evaluateAchievements();
            movePumpkin();
        });
    }

    /* пересчёт позиции при ресайзе, чтобы тыква не улетала за край */
    window.addEventListener('resize', function () {
        if (!isSystemGameActive) return;
        var s = areaSize();
        if (!el.pumpkin) return;
        var x = parseFloat(el.pumpkin.style.left) || 0;
        var y = parseFloat(el.pumpkin.style.top) || 0;
        if (x > s.w) el.pumpkin.style.left = s.w + 'px';
        if (y > s.h) el.pumpkin.style.top = s.h + 'px';
    });

})();
</script>

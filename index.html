<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ================== ЯЗЫК ================== */
  var L = {
    ru: {
      t1:'Мониторинг Технички МЗ', s1:'Промышленный хэллоуинский монолит', st:'Система активна',
      k1:'Имя узла',k2:'Издание',k3:'Дата создания',k4:'Время работы',k5:'База данных',k6:'Сетевой узел',
      v2:'Halloween Edition',dev:'Разработчик',ai:'ИИ-Архитекторы',sp:'Спонсор',
      t2:'🦇 Хэллоуинская Игра',s2:'Лови тыквы, избегай проклятий',
      sc:'Счет',tm:'Время',bs:'Рекорд',str:'Серия',go:'Старт',stop:'Стоп',
      share:'📤 Поделиться рекордом', copied:'Скопировано!',
      ach:'🎃 Достижения сессии',
      a1:'❌ Охотник за призраками (10)',a2:'❌ Повелитель тыкв (25)',a3:'❌ Комбо-мастер (x5)',
      a4:'❌ Хардкорщик (10 в хардкоре)',a5:'❌ Серийный убийца (серия 10)',
      a1o:'🏆 Охотник за призраками (Получено!)',a2o:'🏆 Повелитель тыкв (Получено!)',
      a3o:'🏆 Комбо-мастер (Получено!)',a4o:'🏆 Хардкорщик (Получено!)',a5o:'🏆 Серийный убийца (Получено!)',
      thP:'Тема: Тыква', thS:'Тема: Самайн',
      sfxOn:'Звуки: вкл', sfxOff:'Звуки: выкл', hcOff:'Хардкор: выкл', hcOn:'Хардкор: вкл',
      skOn:'Скелеты: вкл', skOff:'Скелеты: выкл', combo:'Комбо x',
      shareTxt:function(v){return 'Мой рекорд: '+v+' очков! 🎃🦇';},
      clk:function(h,m,s){return h+'ч '+m+'мин '+s+'сек';},
      tour:[
        {ti:'Добро пожаловать!',tx:'Короткий тур покажет, что тут есть. Можно пропустить.',sel:null},
        {ti:'Язык и тема',tx:'RU/EN переключают язык. «Тема» меняет оформление.',sel:'#theme-toggle'},
        {ti:'Музыка',tx:'Ссылка уже вставлена. Нажмите «▶ Играть». «■ Стоп» — остановить.',sel:'.music-bar'},
        {ti:'Мониторинг',tx:'Левая карточка — статус узла.',sel:'#tour-card-info'},
        {ti:'Игра',tx:'«Старт» запускает тыкву. Бонус 🕷️ +3, проклятие 👿 −2. Рекорд сохраняется.',sel:'#game-card'},
        {ti:'Готово!',tx:'Кнопка «?» в углу запустит тур снова.',sel:null}
      ]
    },
    en: {
      t1:'MZ Tech Node Monitor', s1:'Industrial Halloween Monolith', st:'System active',
      k1:'Node name',k2:'Edition',k3:'Created',k4:'Uptime',k5:'Database',k6:'Network node',
      v2:'Halloween Edition',dev:'Developer',ai:'AI Architects',sp:'Sponsor',
      t2:'🦇 Halloween Game',s2:'Catch pumpkins, avoid curses',
      sc:'Score',tm:'Time',bs:'Best',str:'Streak',go:'Start',stop:'Stop',
      share:'📤 Share best score', copied:'Copied!',
      ach:'🎃 Session achievements',
      a1:'❌ Ghost hunter (10)',a2:'❌ Pumpkin lord (25)',a3:'❌ Combo master (x5)',
      a4:'❌ Hardcore (10 in hardcore)',a5:'❌ Serial killer (streak 10)',
      a1o:'🏆 Ghost hunter (Unlocked!)',a2o:'🏆 Pumpkin lord (Unlocked!)',
      a3o:'🏆 Combo master (Unlocked!)',a4o:'🏆 Hardcore (Unlocked!)',a5o:'🏆 Serial killer (Unlocked!)',
      thP:'Theme: Pumpkin', thS:'Theme: Samhain',
      sfxOn:'SFX: on', sfxOff:'SFX: off', hcOff:'Hardcore: off', hcOn:'Hardcore: on',
      skOn:'Skeletons: on', skOff:'Skeletons: off', combo:'Combo x',
      shareTxt:function(v){return 'My best: '+v+' points! 🎃🦇';},
      clk:function(h,m,s){return h+'h '+m+'m '+s+'s';},
      tour:[
        {ti:'Welcome!',tx:'A short tour. You can skip.',sel:null},
        {ti:'Lang & theme',tx:'RU/EN switch language. "Theme" changes look.',sel:'#theme-toggle'},
        {ti:'Music',tx:'Link is pre-filled. Press "▶ Play". "■ Stop" stops it.',sel:'.music-bar'},
        {ti:'Monitor',tx:'Left card — node status.',sel:'#tour-card-info'},
        {ti:'Game',tx:'"Start" launches pumpkin. Bonus 🕷️ +3, curse 👿 −2. Best is saved.',sel:'#game-card'},
        {ti:'Done!',tx:'"?" button re-opens tour.',sel:null}
      ]
    }
  };
  var lang = 'ru', theme = 'pumpkin', sfxOn = true, hardcore = false, skelOn = true;

  function setText(id, v) { var e = $(id); if (e) e.textContent = v; }

  /* ================== АУДИО-ПЛЕЕР (ссылка по умолчанию) ================== */
  var DEFAULT_MUSIC_URL = 'https://archive.org/download/AndrewGoldSpookyScarySkeletons/Andrew%20Gold%20-%20Spooky%20Scary%20Skeletons.mp3';
  var audioEl = new Audio();
  audioEl.loop = true;
  audioEl.crossOrigin = 'anonymous';

  function updateMusicBtn(playing) {
    var b = $('music-play');
    if (b) {
      b.classList.toggle('playing', !!playing);
      b.textContent = playing ? '❚❚ Пауза' : '▶ Играть';
    }
  }

  // автозаполнение поля ссылкой по умолчанию
  if ($('music-url') && !$('music-url').value) {
    $('music-url').value = DEFAULT_MUSIC_URL;
  }

  if ($('music-play')) {
    $('music-play').addEventListener('click', function () {
      var urlInput = $('music-url');
      var url = urlInput ? urlInput.value.trim() : '';

      if (audioEl.src && !audioEl.paused) {
        audioEl.pause();
        updateMusicBtn(false);
        return;
      }
      if (audioEl.src && audioEl.paused && !url) {
        audioEl.play().then(function () { updateMusicBtn(true); }).catch(function () {});
        return;
      }
      if (!url) { alert('Вставьте прямую ссылку на .mp3/.ogg/.wav'); return; }
      if (!/^https?:\/\//i.test(url) && !/^[\w./-]+\.(mp3|ogg|wav)$/i.test(url)) {
        alert('Ссылка должна начинаться с http:// или https://');
        return;
      }

      audioEl.src = url;
      audioEl.load();
      audioEl.play().then(function () {
        updateMusicBtn(true);
        try { localStorage.setItem('mz_music_url', url); } catch (e) {}
      }).catch(function (err) {
        console.warn('Не удалось воспроизвести:', err);
        alert('Не удалось воспроизвести. Проверьте, что это прямая ссылка на аудиофайл (не страница YouTube).');
        updateMusicBtn(false);
      });
    });
  }

  if ($('music-stop')) {
    $('music-stop').addEventListener('click', function () {
      audioEl.pause();
      audioEl.currentTime = 0;
      updateMusicBtn(false);
    });
  }

  // если пользователь менял ссылку — восстановить её (но не автозапуск)
  try {
    var savedUrl = localStorage.getItem('mz_music_url');
    if (savedUrl && $('music-url')) $('music-url').value = savedUrl;
  } catch (e) {}

  /* ================== SFX (короткие звуки) ================== */
  var sfxCtx = null;
  function ensureSfx() {
    if (sfxCtx) {
      if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(function () {});
      return true;
    }
    try {
      sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (sfxCtx.state === 'suspended') sfxCtx.resume().catch(function () {});
      return true;
    } catch (e) { return false; }
  }
  function playBlip(f1, f2, v, type) {
    if (!sfxOn) return;
    if (!ensureSfx()) return;
    try {
      var t = sfxCtx.currentTime, o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f1, t);
      o.frequency.exponentialRampToValueAtTime(f2, t + 0.18);
      g.gain.setValueAtTime(v, t);
      g.gain.linearRampToValueAtTime(0.001, t + 0.2);
      o.connect(g); g.connect(sfxCtx.destination);
      o.start(t); o.stop(t + 0.22);
    } catch (e) {}
  }
  var music = {
    catchSfx: function () { playBlip(700, 140, 0.14); },
    bonusSfx: function () { playBlip(980, 1500, 0.10, 'sine'); },
    cursedSfx: function () { playBlip(220, 60, 0.16, 'sawtooth'); }
  };

  /* ================== applyLang ================== */
  function applyLang() {
    var t = L[lang];
    setText('t-title1', t.t1); setText('t-sub1', t.s1); setText('t-status', t.st);
    setText('t-k1', t.k1); setText('t-k2', t.k2); setText('t-k3', t.k3); setText('t-k4', t.k4);
    setText('t-k5', t.k5); setText('t-k6', t.k6);
    setText('t-v2', t.v2); setText('t-dev', t.dev); setText('t-ai', t.ai); setText('t-sponsor', t.sp);
    setText('t-title2', t.t2); setText('t-sub2', t.s2);
    setText('t-score', t.sc); setText('t-time', t.tm); setText('t-best', t.bs); setText('t-streak', t.str);
    setText('start-btn', t.go); setText('stop-btn', t.stop); setText('share-btn', t.share); setText('t-ach', t.ach);
    for (var i = 1; i <= 5; i++) {
      var e = $('ach' + i);
      if (e && !e.classList.contains('on')) e.textContent = t['a' + i];
    }
    setText('theme-label', theme === 'pumpkin' ? t.thP : t.thS);
    setText('sfx-label', sfxOn ? t.sfxOn : t.sfxOff);
    setText('hardcore-label', hardcore ? t.hcOn : t.hcOff);
    setText('skel-label', skelOn ? t.skOn : t.skOff);
    if ($('lang-ru')) $('lang-ru').classList.toggle('active', lang === 'ru');
    if ($('lang-en')) $('lang-en').classList.toggle('active', lang === 'en');
    updateCombo();
  }

  /* ================== Язык ================== */
  if ($('lang-ru')) $('lang-ru').addEventListener('click', function () { lang = 'ru'; applyLang(); });
  if ($('lang-en')) $('lang-en').addEventListener('click', function () { lang = 'en'; applyLang(); });

  /* ================== Часы ================== */
  var sec = 0;
  setInterval(function () {
    sec++;
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var c = $('clock'); if (c) c.textContent = L[lang].clk(h, m, s);
  }, 1000);

  /* ================== Тема ================== */
  if ($('theme-toggle')) $('theme-toggle').addEventListener('click', function () {
    theme = (theme === 'pumpkin') ? 'samhain' : 'pumpkin';
    document.body.classList.toggle('theme-samhain', theme === 'samhain');
    if ($('theme-icon')) $('theme-icon').textContent = (theme === 'samhain') ? '🌿' : '🎃';
    applyLang();
  });

  /* ================== Тумблеры ================== */
  if ($('sfx-toggle')) $('sfx-toggle').addEventListener('click', function () {
    sfxOn = !sfxOn; this.classList.toggle('active', sfxOn);
    if ($('sfx-icon')) $('sfx-icon').textContent = sfxOn ? '🔔' : '🔕'; applyLang();
  });
  if ($('hardcore-toggle')) $('hardcore-toggle').addEventListener('click', function () {
    hardcore = !hardcore; this.classList.toggle('active', hardcore);
    if ($('hardcore-icon')) $('hardcore-icon').textContent = hardcore ? '☠️' : '💀'; applyLang();
  });
  if ($('skeleton-toggle')) $('skeleton-toggle').addEventListener('click', function () {
    skelOn = !skelOn; this.classList.toggle('active', skelOn);
    if ($('skel-icon')) $('skel-icon').textContent = skelOn ? '💃' : '🚫';
    if (!skelOn) removeSkeletons(); applyLang();
  });

  /* ================== Рекорд ================== */
  var best = 0;
  try { var sb = localStorage.getItem('mz_halloween_best'); if (sb) best = parseInt(sb, 10) || 0; } catch (e) {}
  if ($('best')) $('best').textContent = best;

  /* ================== Фишки ================== */
  var torch = document.createElement('div');
  torch.style.cssText = 'position:fixed;pointer-events:none;z-index:5;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,160,60,.10),transparent 65%);transform:translate(-50%,-50%);opacity:0;mix-blend-mode:screen;transition:opacity .3s;';
  document.body.appendChild(torch);
  document.addEventListener('mousemove', function (e) {
    torch.style.left = e.clientX + 'px'; torch.style.top = e.clientY + 'px'; torch.style.opacity = 1;
  });
  document.addEventListener('mouseleave', function () { torch.style.opacity = 0; });

  function spawnBat() {
    var b = document.createElement('div'); b.textContent = '🦇';
    b.style.cssText = 'position:fixed;z-index:6;pointer-events:none;filter:drop-shadow(0 0 6px rgba(255,98,0,.5));font-size:' + (18 + Math.random() * 16) + 'px;';
    var y = Math.random() * window.innerHeight * .6, dir = Math.random() < .5 ? 1 : -1;
    b.style.top = y + 'px'; b.style.left = (dir === 1 ? -60 : window.innerWidth + 60) + 'px';
    b.style.transition = 'left 8s linear, top 8s linear';
    document.body.appendChild(b);
    requestAnimationFrame(function () {
      b.style.left = (dir === 1 ? window.innerWidth + 60 : -60) + 'px';
      b.style.top = (y + (Math.random() * 200 - 100)) + 'px';
    });
    setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 8200);
  }
  setInterval(function () { if (Math.random() < .7) spawnBat(); }, 18000);

  var skeletons = [];
  function removeSkeletons() {
    skeletons.forEach(function (s) { if (s.parentNode) s.parentNode.removeChild(s); });
    skeletons = [];
  }
  var st = document.createElement('style');
  st.textContent = '@keyframes skelDance{0%{transform:rotate(-12deg) translateY(0);}100%{transform:rotate(12deg) translateY(-6px);}}@keyframes sparkFade{0%{opacity:1;transform:scale(1);}100%{opacity:0;transform:scale(0) translateY(-30px);}}@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-50px) scale(1.3);}}';
  document.head.appendChild(st);

  function spawnSkeleton() {
    var arena = $('arena'); if (!skelOn || !arena) return;
    var s = document.createElement('div');
    s.textContent = Math.random() < .5 ? '💀' : '🦴';
    s.style.cssText = 'position:absolute;font-size:28px;z-index:2;pointer-events:none;' +
      'left:' + Math.floor(Math.random() * (arena.clientWidth - 40)) + 'px;' +
      'bottom:' + Math.floor(Math.random() * 40) + 'px;' +
      'animation:skelDance .6s ease-in-out infinite alternate;transform-origin:bottom center;' +
      'filter:drop-shadow(0 0 6px rgba(255,255,255,.4));' +
      'animation-delay:' + (Math.random() * .5) + 's;';
    arena.appendChild(s); skeletons.push(s);
    setTimeout(function () {
      if (s.parentNode) s.parentNode.removeChild(s);
      var i = skeletons.indexOf(s); if (i >= 0) skeletons.splice(i, 1);
    }, 2500);
  }
  setInterval(function () { if (skelOn) spawnSkeleton(); }, 2000);

  function sparkAt(x, y) {
    var s = document.createElement('div');
    s.textContent = Math.random() < .5 ? '✨' : '⭐';
    s.style.cssText = 'position:fixed;z-index:9;pointer-events:none;font-size:14px;left:' + x + 'px;top:' + y + 'px;animation:sparkFade 1s ease-out forwards;';
    document.body.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1000);
  }

  /* ================== Игра ================== */
  var active = false, gameLoop = null, timerLoop = null, specialTimer = null;
  var score = 0, timeLeft = 30, combo = { count: 0, max: 0, last: 0 };
  var streak = 0, streakTimer = null, pState = 'normal';

  function arenaSize() {
    var a = $('arena'); if (!a) return { w: 300, h: 150 };
    return { w: Math.max(10, a.clientWidth - 50), h: Math.max(10, a.clientHeight - 50) };
  }
  function movePumpkin() {
    if (!active) return; var p = $('pumpkin'); if (!p) return;
    var s = arenaSize();
    p.style.left = Math.floor(Math.random() * s.w) + 'px';
    p.style.top = Math.floor(Math.random() * s.h) + 'px';
  }
  function setState(st2) {
    pState = st2; var p = $('pumpkin'); if (!p) return;
    p.classList.remove('bonus', 'cursed');
    if (st2 === 'bonus') { p.classList.add('bonus'); p.textContent = '🕷️'; }
    else if (st2 === 'cursed') { p.classList.add('cursed'); p.textContent = '👿'; }
    else p.textContent = '🎃';
  }
  function scheduleSpecial() {
    clearTimeout(specialTimer); if (!active) return;
    var base = hardcore ? 4000 : 2500;
    specialTimer = setTimeout(function () {
      if (!active) return;
      var r = Math.random();
      if (r < .35) setState('bonus');
      else if (r < .55) setState('cursed');
      else setState('normal');
      scheduleSpecial();
    }, base + Math.random() * 3000);
  }
  function floatScore(x, y, txt, cls) {
    var a = $('arena'); if (!a) return;
    var f = document.createElement('div');
    f.textContent = txt;
    f.style.cssText = 'position:absolute;font-weight:900;font-size:18px;pointer-events:none;z-index:5;left:' + x + 'px;top:' + y + 'px;animation:floatUp .9s ease-out forwards;text-shadow:0 0 10px currentColor;color:' + (cls === 'minus' ? '#c0392b' : (cls === 'plus3' ? '#ff6200' : '#2ecc71')) + ';';
    a.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 950);
  }
  function updateScore() {
    if ($('score')) $('score').textContent = score;
    if (score > best) { best = score; if ($('best')) $('best').textContent = best; try { localStorage.setItem('mz_halloween_best', best); } catch (e) {} }
  }
  function updateStreak() { if ($('streak')) $('streak').textContent = streak; }
  function bumpStreak() {
    streak++; updateStreak();
    clearTimeout(streakTimer);
    streakTimer = setTimeout(function () { streak = 0; updateStreak(); }, 1500);
  }
  function evalAch() {
    var t = L[lang];
    if (score >= 10 && $('ach1')) { $('ach1').textContent = t.a1o; $('ach1').classList.add('on'); }
    if (score >= 25 && $('ach2')) { $('ach2').textContent = t.a2o; $('ach2').classList.add('on'); }
    if (combo.max >= 5 && $('ach3')) { $('ach3').textContent = t.a3o; $('ach3').classList.add('on'); }
    if (hardcore && score >= 10 && $('ach4')) { $('ach4').textContent = t.a4o; $('ach4').classList.add('on'); }
    if (streak >= 10 && $('ach5')) { $('ach5').textContent = t.a5o; $('ach5').classList.add('on'); }
  }
  function updateCombo() {
    var c = $('combo'); if (!c) return;
    if (combo.count >= 2) { c.textContent = L[lang].combo + combo.count + '!'; c.classList.add('show'); }
    else c.classList.remove('show');
  }
  function registerClick() {
    var n = Date.now();
    if (n - combo.last < 900) combo.count++; else combo.count = 1;
    combo.last = n;
    if (combo.count > combo.max) combo.max = combo.count;
    updateCombo();
  }
  function resetUI() {
    score = 0; timeLeft = 30; streak = 0;
    combo = { count: 0, max: 0, last: 0 };
    if ($('score')) $('score').textContent = '0';
    if ($('timer')) $('timer').textContent = '30';
    if ($('streak')) $('streak').textContent = '0';
    if ($('combo')) { $('combo').textContent = ''; $('combo').classList.remove('show'); }
    var t = L[lang];
    for (var i = 1; i <= 5; i++) {
      var e = $('ach' + i); if (e) { e.textContent = t['a' + i]; e.classList.remove('on'); }
    }
  }
  function stopGame() {
    active = false;
    if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
    if (timerLoop) { clearInterval(timerLoop); timerLoop = null; }
    clearTimeout(specialTimer); specialTimer = null;
    clearTimeout(streakTimer);
    if ($('game-card')) $('game-card').classList.remove('active');
    setState('normal');
    var p = $('pumpkin'); if (p) { p.style.left = '45%'; p.style.top = '35%'; }
  }
  function startGame() {
    stopGame(); resetUI(); active = true;
    if ($('game-card')) $('game-card').classList.add('active');
    setState('normal'); movePumpkin();
    gameLoop = setInterval(movePumpkin, hardcore ? 375 : 750);
    timerLoop = setInterval(function () {
      timeLeft--;
      if ($('timer')) $('timer').textContent = timeLeft;
      if (timeLeft <= 0) { stopGame(); evalAch(); }
    }, 1000);
    scheduleSpecial();
  }
  if ($('start-btn')) $('start-btn').addEventListener('click', startGame);
  if ($('stop-btn')) $('stop-btn').addEventListener('click', stopGame);

  if ($('pumpkin')) $('pumpkin').addEventListener('click', function (e) {
    if (!active) return;
    registerClick(); bumpStreak();
    var p = $('pumpkin');
    var x = parseFloat(p.style.left) || 0, y = parseFloat(p.style.top) || 0;
    var mult = hardcore ? 2 : 1;
    if (pState === 'bonus') { score += 3 * mult; music.bonusSfx(); floatScore(x, y, '+' + (3 * mult), 'plus3'); setState('normal'); }
    else if (pState === 'cursed') {
      score = Math.max(0, score - 2); music.cursedSfx(); floatScore(x, y, '-2', 'minus');
      document.body.classList.add('shake');
      setTimeout(function () { document.body.classList.remove('shake'); }, 400);
      setState('normal');
    }
    else { score += 1 * mult; music.catchSfx(); floatScore(x, y, '+' + (1 * mult), 'plus'); }
    sparkAt(e.clientX, e.clientY);
    updateScore(); evalAch(); movePumpkin();
  });

  if ($('share-btn')) $('share-btn').addEventListener('click', function () {
    var txt = L[lang].shareTxt(best), btn = this;
    function done() { btn.textContent = L[lang].copied; setTimeout(function () { btn.textContent = L[lang].share; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(function () { try { prompt('Ctrl+C:', txt); } catch (e) {} });
    } else { try { prompt('Ctrl+C:', txt); } catch (e) {} }
  });

  window.addEventListener('resize', function () {
    if (!active || !$('pumpkin')) return;
    var s = arenaSize(), p = $('pumpkin');
    var x = parseFloat(p.style.left) || 0, y = parseFloat(p.style.top) || 0;
    if (x > s.w) p.style.left = s.w + 'px';

  }
  function startGame(){
    stopGame();resetUI();active=true;
    if($('game-card'))$('game-card').classList.add('active');
    setState('normal');movePumpkin();
    gameLoop=setInterval(movePumpkin,hardcore?375:750);
    timerLoop=setInterval(function(){
      timeLeft--;
      if($('timer'))$('timer').textContent=timeLeft;
      if(timeLeft<=0){stopGame();evalAch();}
    },1000);
    scheduleSpecial();
  }
  if($('start-btn'))$('start-btn').addEventListener('click',startGame);
  if($('stop-btn'))$('stop-btn').addEventListener('click',stopGame);

  if($('pumpkin'))$('pumpkin').addEventListener('click',function(e){
    if(!active)return;
    registerClick();bumpStreak();
    var p=$('pumpkin');
    var x=parseFloat(p.style.left)||0,y=parseFloat(p.style.top)||0;
    var mult=hardcore?2:1;
    if(pState==='bonus'){score+=3*mult;music.bonusSfx();floatScore(x,y,'+'+(3*mult),'plus3');setState('normal');}
    else if(pState==='cursed'){
      score=Math.max(0,score-2);music.cursedSfx();floatScore(x,y,'-2','minus');
      document.body.classList.add('shake');
      setTimeout(function(){document.body.classList.remove('shake');},400);
      setState('normal');
    }
    else{score+=1*mult;music.catchSfx();floatScore(x,y,'+'+(1*mult),'plus');}
    sparkAt(e.clientX,e.clientY);
    updateScore();evalAch();movePumpkin();
  });

  if($('share-btn'))$('share-btn').addEventListener('click',function(){
    var txt=L[lang].shareTxt(best),btn=this;
    function done(){btn.textContent=L[lang].copied;setTimeout(function(){btn.textContent=L[lang].share;},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){try{prompt('Ctrl+C:',txt);}catch(e){}});
    }else{try{prompt('Ctrl+C:',txt);}catch(e){}}
  });

  window.addEventListener('resize',function(){
    if(!active||!$('pumpkin'))return;
    var s=arenaSize(),p=$('pumpkin');
    var x=parseFloat(p.style.left)||0,y=parseFloat(p.style.top)||0;
    if(x>s.w)p.style.left=s.w+'px';
    if(y>s.h)p.style.top=s.h+'px';
  });

  /* ===== Тур ===== */
  var tourOverlay=$('tour-overlay'),tourHighlight=$('tour-highlight'),
      tourTooltip=$('tour-tooltip'),tourTitle=$('tour-title'),
      tourContent=$('tour-content'),tourNextBtn=$('tour-next'),
      tourSkipBtn=$('tour-skip'),tourProgress=$('tour-progress');
  var tourSteps=[],tourIdx=0,tourActive=false,currentIPKey=null;

  function centerTooltip(){
    if(!tourTooltip)return;
    tourTooltip.style.left='50%';tourTooltip.style.top='50%';
    tourTooltip.style.transform='translate(-50%,-50%)';
  }
  function openTour(){
    tourSteps=L[lang].tour.slice();tourIdx=0;tourActive=true;
    if(tourOverlay)tourOverlay.classList.add('open');
    if(tourTooltip)tourTooltip.style.display='block';
    renderTour();
  }
  function closeTour(markSeen){
    tourActive=false;
    if(tourOverlay)tourOverlay.classList.remove('open');
    if(tourTooltip)tourTooltip.style.display='none';
    if(tourHighlight)tourHighlight.style.display='none';
    if(markSeen&&currentIPKey){try{localStorage.setItem(currentIPKey,'1');}catch(e){}}
  }
  function renderTour(){
    if(!tourActive)return;
    var s=tourSteps[tourIdx];
    if(!s){closeTour(true);return;}
    if(tourTitle)tourTitle.textContent=s.ti;
    if(tourContent)tourContent.textContent=s.tx;
    if(tourProgress)tourProgress.textContent=(tourIdx+1)+' / '+tourSteps.length;
    if(tourNextBtn)tourNextBtn.textContent=(tourIdx===tourSteps.length-1)?'Готово':'Далее';
    if(tourHighlight){
      if(s.sel){
        var target=document.querySelector(s.sel);
        if(target){
          var r=target.getBoundingClientRect();
          tourHighlight.style.display='block';
          tourHighlight.style.left=(r.left-6)+'px';
          tourHighlight.style.top=(r.top-6)+'px';
          tourHighlight.style.width=(r.width+12)+'px';
          tourHighlight.style.height=(r.height+12)+'px';
          if(tourTooltip){
            tourTooltip.style.transform='none';
            tourTooltip.style.left=Math.min(window.innerWidth-340,Math.max(10,r.left))+'px';
            tourTooltip.style.top=Math.min(window.innerHeight-260,r.bottom+12)+'px';
          }
        }else{tourHighlight.style.display='none';centerTooltip();}
      }else{tourHighlight.style.display='none';centerTooltip();}
    }
  }
  if(tourNextBtn)tourNextBtn.addEventListener('click',function(){
    tourIdx++;
    if(tourIdx>=tourSteps.length)closeTour(true);else renderTour();
  });
  if(tourSkipBtn)tourSkipBtn.addEventListener('click',function(){closeTour(true);});
  if($('help-btn'))$('help-btn').addEventListener('click',openTour);

  function fetchIP(){
    return new Promise(function(resolve){
      var done=false;
      var tm=setTimeout(function(){if(!done){done=true;resolve(null);}},4000);
      try{
        fetch('https://api.ipify.org?format=json')
          .then(function(r){return r.json();})
          .then(function(d){if(!done){done=true;clearTimeout(tm);resolve(d&&d.ip?d.ip:null);}})
          .catch(function(){if(!done){done=true;clearTimeout(tm);resolve(null);}});
      }catch(e){if(!done){done=true;clearTimeout(tm);resolve(null);}}
    });
  }

  fetchIP().then(function(ip){
    currentIPKey='tour_seen_'+(ip||'unknown');
    var seen=false;
    try{seen=localStorage.getItem(currentIPKey)==='1';}catch(e){}
    if(!seen)setTimeout(openTour,600);
  });

  /* вызов в самом конце — когда всё объявлено */
  applyLang();
})();
</script>

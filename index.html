<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>МЗ: Проклятие Технички (v6.0)</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08050c; --panel:rgba(20,10,30,.7);
  --text:#fff; --muted:#9d8ca1;
  --accent:#ff6200; --accent-2:#8e44ad; --green:#2ecc71; --red:#e74c3c; --gold:#f1c40f;
  --border:rgba(255,98,0,.4); --border-2:rgba(142,68,173,.5);
  --glow-orange:0 0 20px rgba(255,98,0,.5); --glow-purple:0 0 20px rgba(142,68,173,.5);
}
body.theme-samhain{--bg:#050a07;--accent:#2ecc71;--accent-2:#c0392b;--border:rgba(46,204,113,.4);--border-2:rgba(192,57,43,.5);--glow-orange:0 0 20px rgba(46,204,113,.5);--glow-purple:0 0 20px rgba(192,57,43,.5);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;overflow-x:hidden;transition:background .5s;user-select:none;}
h1,h2{font-family:'Creepster',cursive;letter-spacing:2px;text-shadow:var(--glow-orange);}
h1{color:var(--accent);font-size:36px;} h2{color:var(--accent-2);font-size:28px;text-shadow:var(--glow-purple);}

/* Фоновые эффекты */
.fog{position:fixed;inset:0;background:url('https://www.transparenttextures.com/patterns/foggy-birds.png');opacity:.3;z-index:0;pointer-events:none;animation:fogMove 60s linear infinite;}
@keyframes fogMove{0%{background-position:0 0;}100%{background-position:1000px 1000px;}}

/* Свечи/паутина по углам */
.web{position:fixed;width:220px;height:250px;z-index:1;pointer-events:none;opacity:0.8;}
.web.tl{top:0;left:0;} .web.tr{top:0;right:0;transform:scaleX(-1);} .web.bl{bottom:0;left:0;transform:scaleY(-1);} .web.br{bottom:0;right:0;transform:scale(-1,-1);}
.web path{stroke:var(--accent);filter:drop-shadow(0 0 5px var(--accent));}

/* Верхнее меню */
.topbar{width:100%;max-width:1100px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:20px;z-index:10;}
.pill{padding:10px 20px;border-radius:30px;background:rgba(0,0,0,.6);border:1px solid var(--border);color:var(--text);font-weight:bold;font-size:13px;cursor:pointer;transition:all .3s;backdrop-filter:blur(5px);}
.pill:hover{background:var(--accent);color:#000;box-shadow:var(--glow-orange);}
.pill.active{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 10px var(--accent);}
.tabs{width:100%;max-width:1100px;display:flex;gap:10px;margin-bottom:20px;z-index:10;}
.tab-btn{flex:1;padding:12px;background:rgba(0,0,0,.6);border:1px solid #333;color:#aaa;font-weight:bold;font-family:'Montserrat';cursor:pointer;border-radius:10px;transition:all .3s;}
.tab-btn.active{background:var(--accent-2);color:#fff;border-color:var(--accent-2);box-shadow:var(--glow-purple);}
.tab-content{display:none;width:100%;max-width:1100px;z-index:10;}
.tab-content.active{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;animation:fadeIn .4s;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* Карточки */
.card{flex:1 1 400px;max-width:520px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:25px;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.8);position:relative;}
.card::before{content:'';position:absolute;inset:0;border-radius:20px;pointer-events:none;box-shadow:inset 0 0 30px rgba(255,98,0,.05);}
.card.game{border-color:var(--border-2);}

/* Данные */
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.1);font-size:14px;}
.row:last-child{border:none;}.k{color:var(--muted);font-size:12px;text-transform:uppercase;}.v{font-weight:bold;}.v.accent{color:var(--accent);}
.credits{margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;line-height:1.8;color:#ccc;}

/* Игра (Котёл) */
.game-area{position:relative;width:100%;height:300px;background:radial-gradient(circle at 50% 100%, #2a0b36 0%, #0a0510 100%);border:2px solid var(--border-2);border-radius:15px;margin-top:15px;overflow:hidden;box-shadow:inset 0 0 50px #000;cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><text y="24" font-size="24">🪄</text></svg>'), auto;}
#cauldron{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:60px;z-index:5;filter:drop-shadow(0 0 15px var(--green));transition:left .1s;}
.falling-item{position:absolute;font-size:35px;z-index:4;pointer-events:none;filter:drop-shadow(0 0 10px #fff);transition:top 0.05s linear;}
.stats{display:flex;justify-content:space-between;margin-top:15px;font-weight:900;font-size:16px;}
.stats span{color:var(--accent);}
.btns{display:flex;gap:10px;margin-top:15px;}
.btn{flex:1;padding:14px;background:linear-gradient(135deg,var(--accent),#a03d00);border:none;border-radius:10px;color:#fff;font-weight:900;font-size:15px;text-transform:uppercase;cursor:pointer;transition:transform .2s,box-shadow .2s;font-family:'Montserrat';}
.btn:hover{transform:translateY(-2px);box-shadow:var(--glow-orange);}
.btn.stop{background:linear-gradient(135deg,var(--red),#8b1a1a);}

/* Changelog */
.changelog{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:25px;width:100%;text-align:left;}
.changelog ul{list-style:none;padding:0;}
.changelog li{margin-bottom:12px;padding-left:20px;position:relative;color:#ddd;font-size:14px;line-height:1.5;}
.changelog li::before{content:'🎃';position:absolute;left:0;top:2px;}
.changelog li b{color:var(--accent);font-size:15px;}

/* Тур */
.tour-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;backdrop-filter:blur(5px);}
.tour-overlay.open{display:block;}
.tour-highlight{position:fixed;z-index:201;border:2px solid var(--accent);border-radius:15px;box-shadow:0 0 0 9999px rgba(0,0,0,.7),0 0 30px var(--accent);pointer-events:none;display:none;transition:all .3s;}
.tour-tooltip{position:fixed;z-index:202;background:#1a0b24;border:2px solid var(--accent-2);border-radius:15px;padding:20px;max-width:300px;box-shadow:var(--glow-purple);display:none;}
.tour-tooltip h3{margin:0 0 10px;color:var(--accent);font-family:'Creepster';font-size:24px;letter-spacing:1px;}
.tour-tooltip p{margin:0 0 15px;color:#ddd;font-size:13px;line-height:1.5;}
.tour-btns{display:flex;gap:10px;justify-content:flex-end;}
.tour-btns button{padding:8px 15px;border:none;font-weight:bold;cursor:pointer;border-radius:8px;font-family:'Montserrat';}
.tour-next{background:var(--accent);color:#000;}
.tour-skip{background:#444;color:#fff;}

.help-btn{position:fixed;bottom:20px;right:20px;z-index:50;width:50px;height:50px;border-radius:50%;background:var(--accent-2);color:#fff;font-size:24px;font-weight:bold;border:none;cursor:pointer;box-shadow:var(--glow-purple);}
</style>
</head>
<body>
<div class="fog"></div>

<svg class="web tl" viewBox="0 0 100 100">
  <path d="M0,0 L100,0 M0,0 L0,100 M0,0 L70,70" fill="none" stroke-width="1"/>
  <path d="M20,0 C20,10 10,20 0,20 M40,0 C40,25 25,40 0,40 M60,0 C60,40 40,60 0,60 M80,0 C80,55 55,80 0,80" fill="none" stroke-width="0.8"/>
</svg>
<svg class="web tr" viewBox="0 0 100 100"></svg>
<svg class="web bl" viewBox="0 0 100 100"></svg>
<svg class="web br" viewBox="0 0 100 100"></svg>

<div class="topbar">
  <button class="pill active" id="lang-ru">RU</button>
  <button class="pill" id="lang-en">EN</button>
  <button class="pill" id="theme-toggle">🎃 Тема: Тыква</button>
  <button class="pill" id="music-toggle">🔇 Музыка: выкл</button>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-main-btn">🎮 Основное</button>
  <button class="tab-btn" id="tab-vers-btn">📜 История обновлений</button>
</div>

<div class="tab-content active" id="tab-main">
  <div class="card" id="card-info">
    <h1>Техничка МЗ</h1>
    <div class="row"><span class="k">Имя узла</span><span class="v">Ozogin-MZ-01</span></div>
    <div class="row"><span class="k">Издание</span><span class="v accent">Halloween Edition</span></div>
    <div class="row"><span class="k">Время работы</span><span class="v accent" id="clock">00:00:00</span></div>
    <div class="row"><span class="k">Пинг</span><span class="v accent" id="ping-display">...</span></div>
    <div class="credits">
      <b>Разработчик:</b> <span style="color:var(--accent)">Ozogin</span><br>
      <b>ИИ-Архитекторы:</b> <span style="color:var(--accent-2)">Алиса & DeepSeek</span><br>
      <b>Спонсор:</b> <span style="color:var(--green)">Alberto Pepper</span>
    </div>
  </div>

  <div class="card game" id="card-game">
    <h2>Варка Зелий</h2>
    <div class="game-area" id="game-area">
      <div id="cauldron">🍲</div>
    </div>
    <div class="stats">
      <div>СЧЕТ: <span id="score">0</span></div>
      <div>ЖИЗНИ: <span id="lives">3</span></div>
      <div>РЕКОРД: <span id="best">0</span></div>
    </div>
    <div class="btns">
      <button class="btn" id="start-btn">Старт</button>
      <button class="btn stop" id="stop-btn">Стоп</button>
    </div>
  </div>
</div>

<div class="tab-content" id="tab-vers">
  <div class="changelog">
    <h2 style="margin-bottom:20px;">История версий</h2>
    <ul id="changelog-list"></ul>
  </div>
</div>

<div class="tour-overlay" id="tour-overlay"></div>
<div class="tour-highlight" id="tour-highlight"></div>
<div class="tour-tooltip" id="tour-tooltip">
  <h3 id="tour-title"></h3><p id="tour-content"></p>
  <div class="tour-btns"><button class="tour-skip" id="tour-skip">Пропустить</button><button class="tour-next" id="tour-next">Далее</button></div>
</div>
<button class="help-btn" id="help-btn">?</button>
<div id="yt-audio-container" style="display:none;"></div>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var L = {
    ru: {
      t1:'Мониторинг Технички МЗ', t2:'Варка Зелий', st:'Система активна', k1:'Имя узла',k2:'Издание',k3:'Дата',k4:'Время работы',k5:'База',k6:'Пинг',
      v2:'Halloween Edition',dev:'Разработчик',ai:'ИИ',sp:'Спонсор',
      sc:'Счет', lv:'Жизни', bs:'Рекорд', go:'Старт', stop:'Стоп',
      thP:'🎃 Тема: Тыква', thS:'🌿 Тема: Самайн', mOff:'🔇 Музыка: выкл', mOn:'🎵 Музыка: вкл',
      clk:function(h,m,s){return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
    },
    en: {
      t1:'MZ Tech Node Monitor', t2:'Potion Brewing', st:'System active', k1:'Node name',k2:'Edition',k3:'Date',k4:'Uptime',k5:'Database',k6:'Ping',
      v2:'Halloween Edition',dev:'Developer',ai:'AI',sp:'Sponsor',
      sc:'Score', lv:'Lives', bs:'Best', go:'Start', stop:'Stop',
      thP:'🎃 Theme: Pumpkin', thS:'🌿 Theme: Samhain', mOff:'🔇 Music: off', mOn:'🎵 Music: on',
      clk:function(h,m,s){return (h<10?'0':'')+h+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}
    }
  };
  var lang='ru', theme='pumpkin', sfxOn=true, musicOn=false;
  function setText(id,v){var e=$(id);if(e)e.textContent=v;}

  if($('tab-main-btn')) $('tab-main-btn').addEventListener('click', function(){ $('tab-main').classList.add('active'); $('tab-vers').classList.remove('active'); this.classList.add('active'); $('tab-vers-btn').classList.remove('active'); });
  if($('tab-vers-btn')) $('tab-vers-btn').addEventListener('click', function(){ $('tab-main').classList.remove('active'); $('tab-vers').classList.add('active'); this.classList.add('active'); $('tab-main-btn').classList.remove('active'); });

  var versions = [
    {v:'1.0', text:'Первый релиз. Базовая игра.'},
    {v:'2.0', text:'Вкладки, переработанный тур.'},
    {v:'3.0', text:'YouTube музыка, скелеты.'},
    {v:'4.0', text:'Пинг, Снитч, Летучие мыши.'},
    {v:'6.0', text:'Глобальный редизайн. Игра «Варка Зелий». Хэллоуинский неон.'}
  ];
  var list = $('changelog-list'); if (list) { list.innerHTML = ''; versions.forEach(function(item) { var li = document.createElement('li'); li.innerHTML = '<b>v' + item.v + '</b> — ' + item.text; list.appendChild(li); }); }

  /* ПИНГ */
  var pingStart = Date.now();
  fetch('https://api.ipify.org?format=json').then(function(){
    if($('ping-display')) $('ping-display').textContent = (Date.now() - pingStart) + ' ms';
  }).catch(function(){ if($('ping-display')) $('ping-display').textContent = 'err'; });

  /* МУЗЫКА */
  var YT_ID = 'RaDa7m76uXY'; var ytPlayer = null; 
  var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; var firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  window.onYouTubeIframeAPIReady = function() { ytPlayer = new YT.Player('yt-audio-container', { height: '0', width: '0', videoId: YT_ID, playerVars: { 'autoplay': 0, 'controls': 0, 'loop': 1, 'playlist': YT_ID } }); };
  if($('music-toggle')){ $('music-toggle').addEventListener('click', function(){ if(!ytPlayer) return; if(musicOn){ ytPlayer.pauseVideo(); musicOn = false; } else { ytPlayer.playVideo(); musicOn = true; } applyLang(); }); }

  function applyLang(){
    var t=L[lang];
    setText('card-info', ''); // Сбрасываем (чтобы не дублировать)
    // Просто обновляем кнопки и заголовки
    setText('theme-toggle', theme==='pumpkin'?t.thP:t.thS);
    setText('music-toggle', musicOn?t.mOn:t.mOff);
    setText('start-btn', t.go); setText('stop-btn', t.stop);
    // Обновляем заголовки карточек
    var h1 = document.querySelector('#card-info h1'); if(h1) h1.textContent = t.t1;
    var h2 = document.querySelector('#card-game h2'); if(h2) h2.textContent = t.t2;
    // Статы
    var sc = document.querySelector('.stats div:nth-child(1)'); if(sc) sc.innerHTML = t.sc + ': <span id="score">0</span>';
    var lv = document.querySelector('.stats div:nth-child(2)'); if(lv) lv.innerHTML = t.lv + ': <span id="lives">3</span>';
    var bs = document.querySelector('.stats div:nth-child(3)'); if(bs) bs.innerHTML = t.bs + ': <span id="best">0</span>';
  }
  
  if($('lang-ru'))$('lang-ru').addEventListener('click',function(){lang='ru';applyLang();this.classList.add('active');$('lang-en').classList.remove('active');});
  if($('lang-en'))$('lang-en').addEventListener('click',function(){lang='en';applyLang();this.classList.add('active');$('lang-ru').classList.remove('active');});
  if($('theme-toggle'))$('theme-toggle').addEventListener('click',function(){ theme=(theme==='pumpkin')?'samhain':'pumpkin'; document.body.classList.toggle('theme-samhain',theme==='samhain'); applyLang(); });

  var sec=0; setInterval(function(){sec++;var h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;var c=$('clock');if(c)c.textContent=L[lang].clk(h,m,s);},1000);

  /* ===== ИГРА ВАРКА ЗЕЛИЙ ===== */
  var active=false, gameLoop=null;
  var score=0, lives=3, best=0;
  var cauldronX = 50; // %
  var items = [];
  var gameArea = $('game-area');
  var cauldron = $('cauldron');
  var itemTimer = null;

  try{var sb=localStorage.getItem('mz_halloween_best');if(sb)best=parseInt(sb,10)||0;}catch(e){} if($('best'))$('best').textContent=best;

  document.addEventListener('mousemove', function(e){
    if(!active || !gameArea) return;
    var rect = gameArea.getBoundingClientRect();
    if(e.clientX > rect.left && e.clientX < rect.right && e.clientY > rect.top && e.clientY < rect.bottom) {
      cauldronX = ((e.clientX - rect.left) / rect.width) * 100;
      cauldronX = Math.max(10, Math.min(90, cauldronX)); // Ограничиваем краями
      cauldron.style.left = cauldronX + '%';
    }
  });

  function spawnItem() {
    if(!active) return;
    var r = Math.random();
    var type, emoji, points;
    
    if(r < 0.15) { type = 'bomb'; emoji = '💣'; points = -1; } // Бомба (отнять жизнь)
    else if(r < 0.35) { type = 'gold'; emoji = '🌟'; points = 5; } // Золотой
    else { type = 'normal'; emoji = ['🎃','🦴','👁️','🧪','🕷️'][Math.floor(Math.random()*5)]; points = 1; }

    var el = document.createElement('div');
    el.className = 'falling-item';
    el.textContent = emoji;
    if(type === 'bomb') el.style.filter = 'drop-shadow(0 0 10px red)';
    if(type === 'gold') el.style.filter = 'drop-shadow(0 0 15px gold)';
    
    var x = Math.random() * 90 + 5; // От 5% до 95%
    el.style.left = x + '%';
    el.style.top = '-50px';
    gameArea.appendChild(el);
    
    var obj = { el: el, x: x, y: -50, speed: 2 + Math.random() * 2 + (score * 0.05), points: points, type: type };
    items.push(obj);
  }

  function updateGame() {
    if(!active) return;
    
    for(var i = items.length - 1; i >= 0; i--) {
      var item = items[i];
      item.y += item.speed;
      item.el.style.top = item.y + 'px';
      
      var rect = gameArea.getBoundingClientRect();
      var cauldronWidthPerc = 15; // Примерная ширина котла в %
      var cauldronLeft = cauldronX - (cauldronWidthPerc / 2);
      var cauldronRight = cauldronX + (cauldronWidthPerc / 2);
      
      // Проверка на столкновение (по Y и X)
      if(item.y > rect.height - 100 && item.y < rect.height - 40) {
        if(item.x > cauldronLeft && item.x < cauldronRight) {
          // Поймали!
          if(item.type === 'bomb') {
            lives--;
            if($('lives')) $('lives').textContent = lives;
            document.body.classList.add('shake');
            setTimeout(function(){document.body.classList.remove('shake');}, 300);
            if(lives <= 0) {
              stopGame();
            }
          } else {
            score += item.points;
            if($('score')) $('score').textContent = score;
            if(score > best) { best = score; if($('best')) $('best').textContent = best; try{localStorage.setItem('mz_halloween_best',best);}catch(e){} }
          }
          if(item.el.parentNode) item.el.parentNode.removeChild(item.el);
          items.splice(i, 1);
          continue;
        }
      }
      
      // Если упал ниже поля
      if(item.y > rect.height) {
        if(item.el.parentNode) item.el.parentNode.removeChild(item.el);
        items.splice(i, 1);
      }
    }
  }

  function startGame() {
    stopGame();
    score=0; lives=3; items=[];
    if($('score')) $('score').textContent = '0';
    if($('lives')) $('lives').textContent = '3';
    gameArea.innerHTML = '';
    var c = document.createElement('div'); c.id = 'cauldron'; c.textContent = '🍲'; gameArea.appendChild(c);
    cauldron = $('cauldron');
    cauldronX = 50; cauldron.style.left = '50%';
    
    active = true;
    gameLoop = setInterval(updateGame, 1000/60); // 60 FPS
    itemTimer = setInterval(spawnItem, 800); // Спавн каждые 0.8 сек
  }

  function stopGame() {
    active = false;
    if(gameLoop) clearInterval(gameLoop);
    if(itemTimer) clearInterval(itemTimer);
    items.forEach(function(i){ if(i.el.parentNode) i.el.parentNode.removeChild(i.el); });
    items = [];
  }

  if($('start-btn')) $('start-btn').addEventListener('click', startGame);
  if($('stop-btn')) $('stop-btn').addEventListener('click', stopGame);

  /* ===== ТУРЫ ===== */
  var tourOverlay=$('tour-overlay'),tourHighlight=$('tour-highlight'),tourTooltip=$('tour-tooltip');
  var tourTitle=$('tour-title'),tourContent=$('tour-content'),tourNextBtn=$('tour-next'),tourSkipBtn=$('tour-skip');
  var tSteps=[], tIdx=0, tActive=false;
  
  var tourWelcome = [{t:'Добро пожаловать!',d:'Новый глобальный дизайн и новая игра.'},{t:'Варка Зелий',d:'Двигай котёл мышкой и лови ингредиенты. Избегай бомб!',sel:'#card-game'},{t:'История',d:'Все обновления записываются во вкладке.',sel:'.tabs'}];
  var tourUpdate = [{t:'🎉 Обновление v6.0',d:'Глобальный редизайн. Неоновый Хэллоуин. Игра «Варка Зелий» с физикой падения.'},{t:'Варка Зелий',d:'Двигай котёл мышкой. Лови тыквы и глаза, избегай бомб.',sel:'#card-game'}];

  function openTour(steps){ tSteps=steps.slice(); tIdx=0; tActive=true; if(tourOverlay)tourOverlay.classList.add('open'); if(tourTooltip)tourTooltip.style.display='block'; renderTour(); }
  function closeTour(){ tActive=false; if(tourOverlay)tourOverlay.classList.remove('open'); if(tourTooltip)tourTooltip.style.display='none'; if(tourHighlight)tourHighlight.style.display='none'; }
  
  function renderTour(){
    if(!tActive)return; var s=tSteps[tIdx]; if(!s){closeTour();return;}
    if(tourTitle)tourTitle.textContent=s.t; if(tourContent)tourContent.textContent=s.d;
    if(tourNextBtn)tourNextBtn.textContent=(tIdx===tSteps.length-1)?'Готово':'Далее';
    if(tourHighlight){
      if(s.sel){
        var target=document.querySelector(s.sel);
        if(target){
          var r=target.getBoundingClientRect(); tourHighlight.style.display='block';
          tourHighlight.style.left=(r.left-6)+'px'; tourHighlight.style.top=(r.top-6)+'px';
          tourHighlight.style.width=(r.width+12)+'px'; tourHighlight.style.height=(r.height+12)+'px';
          if(tourTooltip){ tourTooltip.style.left=Math.min(window.innerWidth-340,Math.max(10,r.left))+'px'; tourTooltip.style.top=Math.min(window.innerHeight-220,r.bottom+15)+'px'; }
        }else{tourHighlight.style.display='none';}
      }else{tourHighlight.style.display='none'; tourTooltip.style.left='50%'; tourTooltip.style.top='50%'; tourTooltip.style.transform='translate(-50%,-50%)';}
    }
  }
  
  if(tourNextBtn)tourNextBtn.addEventListener('click',function(){tIdx++;if(tIdx>=tSteps.length)closeTour();else renderTour();});
  if(tourSkipBtn)tourSkipBtn.addEventListener('click',closeTour);
  if($('help-btn'))$('help-btn').addEventListener('click',function(){ openTour(tourWelcome); });

  function fetchIP(){ return new Promise(function(resolve){ var done=false;var tm=setTimeout(function(){if(!done){done=true;resolve('unknown');}},3000); try{fetch('https://api.ipify.org?format=json').then(function(r){return r.json();}).then(function(d){if(!done){done=true;clearTimeout(tm);resolve(d&&d.ip?d.ip:'unknown');}}).catch(function(){if(!done){done=true;clearTimeout(tm);resolve('unknown');}});}catch(e){if(!done){done=true;clearTimeout(tm);resolve('unknown');}} }); }

  fetchIP().then(function(ip){
    var keyWelcome = 'tour_welcome_v6_' + ip;
    var keyUpdate = 'tour_update_v6_' + ip;
    var seenWelcome = false; var seenUpdate = false;
    try { seenWelcome = localStorage.getItem(keyWelcome) === '1'; seenUpdate = localStorage.getItem(keyUpdate) === '1'; } catch(e) {}
    
    if(!seenUpdate) {
      if(!seenWelcome) {
        setTimeout(function() {
          openTour(tourWelcome);
          var checkClosed = setInterval(function() { if(!tActive) { clearInterval(checkClosed); try{ localStorage.setItem(keyWelcome, '1'); }catch(e){} setTimeout(function() { openTour(tourUpdate); }, 500); } }, 500);
        }, 600);
      } else {
        setTimeout(function() {
          openTour(tourUpdate);
          var checkClosed = setInterval(function() { if(!tActive) { clearInterval(checkClosed); try{ localStorage.setItem(keyUpdate, '1'); }catch(e){} } }, 500);
        }, 600);
      }
    }
  });

  applyLang();
})();
</script>

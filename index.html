<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var el = {
    clock: $('clock'),
    langRu: $('lang-ru'), langEn: $('lang-en'),
    themeToggle: $('theme-toggle'), themeIcon: $('theme-icon'), themeLabel: $('theme-label'),
    musicToggle: $('music-toggle'), musicIcon: $('music-icon'), musicLabel: $('music-label'),
    pumpkin: $('pumpkin'), arena: $('arena'),
    score: $('score'), timer: $('timer'), best: $('best'), combo: $('combo'),
    startBtn: $('start-btn'), stopBtn: $('stop-btn'),
    ach1: $('ach1'), ach2: $('ach2'), ach3: $('ach3')
  };

  /* ================== ЯЗЫК ================== */
  var LANG = {
    ru: {
      title1: 'Мониторинг Технички МЗ', sub1: 'Промышленный хэллоуинский монолит',
      status: 'Система активна',
      k1: 'Имя узла', k2: 'Издание', k3: 'Дата создания', k4: 'Время работы', k5: 'База данных', k6: 'Сетевой узел',
      v2: 'Halloween Edition', dev: 'Разработчик', ai: 'ИИ-Архитекторы', sponsor: 'Спонсор',
      title2: '🦇 Хэллоуинская Игра', sub2: 'Лови тыквы, избегай проклятий',
      score: 'Счет', time: 'Время', best: 'Рекорд', start: 'Старт', stop: 'Стоп',
      ach: '🎃 Достижения сессии',
      ach1: '❌ Охотник за призраками (10)', ach2: '❌ Повелитель тыкв (25)', ach3: '❌ Комбо-мастер (x5)',
      ach1on: '🏆 Охотник за призраками (Получено!)', ach2on: '🏆 Повелитель тыкв (Получено!)', ach3on: '🏆 Комбо-мастер (Получено!)',
      themePumpkin: 'Тема: Тыква', themeSamhain: 'Тема: Самайн',
      musicOff: 'Музыка: выкл', musicOn: 'Музыка: вкл',
      clockFmt: function (h, m, s) { return h + 'ч ' + m + 'мин ' + s + 'сек'; }
    },
    en: {
      title1: 'MZ Tech Node Monitor', sub1: 'Industrial Halloween Monolith',
      status: 'System active',
      k1: 'Node name', k2: 'Edition', k3: 'Created', k4: 'Uptime', k5: 'Database', k6: 'Network node',
      v2: 'Halloween Edition', dev: 'Developer', ai: 'AI Architects', sponsor: 'Sponsor',
      title2: '🦇 Halloween Game', sub2: 'Catch pumpkins, avoid curses',
      score: 'Score', time: 'Time', best: 'Best', start: 'Start', stop: 'Stop',
      ach: '🎃 Session achievements',
      ach1: '❌ Ghost hunter (10)', ach2: '❌ Pumpkin lord (25)', ach3: '❌ Combo master (x5)',
      ach1on: '🏆 Ghost hunter (Unlocked!)', ach2on: '🏆 Pumpkin lord (Unlocked!)', ach3on: '🏆 Combo master (Unlocked!)',
      themePumpkin: 'Theme: Pumpkin', themeSamhain: 'Theme: Samhain',
      musicOff: 'Music: off', musicOn: 'Music: on',
      clockFmt: function (h, m, s) { return h + 'h ' + m + 'm ' + s + 's'; }
    }
  };
  var lang = 'ru';
  function setText(id, txt) { var e = $(id); if (e) e.textContent = txt; }

  function applyLang() {
    var t = LANG[lang];
    setText('t-title1', t.title1); setText('t-sub1', t.sub1); setText('t-status', t.status);
    setText('t-k1', t.k1); setText('t-k2', t.k2); setText('t-k3', t.k3);
    setText('t-k4', t.k4); setText('t-k5', t.k5); setText('t-k6', t.k6);
    setText('t-v2', t.v2); setText('t-dev', t.dev); setText('t-ai', t.ai); setText('t-sponsor', t.sponsor);
    setText('t-title2', t.title2); setText('t-sub2', t.sub2);
    setText('t-score', t.score); setText('t-time', t.time); setText('t-best', t.best);
    setText('start-btn', t.start); setText('stop-btn', t.stop); setText('t-ach', t.ach);
    if (el.ach1 && !el.ach1.classList.contains('on')) el.ach1.textContent = t.ach1;
    if (el.ach2 && !el.ach2.classList.contains('on')) el.ach2.textContent = t.ach2;
    if (el.ach3 && !el.ach3.classList.contains('on')) el.ach3.textContent = t.ach3;
    el.themeLabel.textContent = (theme === 'pumpkin') ? t.themePumpkin : t.themeSamhain;
    el.musicLabel.textContent = music.on ? t.musicOn : t.musicOff;
    el.langRu.classList.toggle('active', lang === 'ru');
    el.langEn.classList.toggle('active', lang === 'en');
  }
  if (el.langRu) el.langRu.addEventListener('click', function () { lang = 'ru'; applyLang(); });
  if (el.langEn) el.langEn.addEventListener('click', function () { lang = 'en'; applyLang(); });

  /* ================== ЧАСЫ ================== */
  var sec = 0;
  setInterval(function () {
    sec++;
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (el.clock) el.clock.textContent = LANG[lang].clockFmt(h, m, s);
  }, 1000);

  /* ================== ТЕМА ================== */
  var theme = 'pumpkin';
  if (el.themeToggle) el.themeToggle.addEventListener('click', function () {
    theme = (theme === 'pumpkin') ? 'samhain' : 'pumpkin';
    document.body.classList.toggle('theme-samhain', theme === 'samhain');
    el.themeIcon.textContent = (theme === 'samhain') ? '🌿' : '🎃';
    el.themeLabel.textContent = (theme === 'samhain') ? LANG[lang].themeSamhain : LANG[lang].themePumpkin;
  });

  /* ================== МУЗЫКА: S P O O K Y   R I T U A L ================== */
  /* Оригинальная аранжировка в духе "spooky-skeletons":
     - "щёлкающий" стаккато-ритм
     - минорная мелодия (Dm)
     - шумовой "стук костей"
     - вокальная партия через SpeechSynthesis (свой текст) */
  var music = {
    ctx: null, master: null, timer: null, on: false, step: 0,
    bpm: 128,
    // 16 шагов мелодии (восьмые). 0 = пауза.
    melody: [
      293.66, 293.66, 349.23, 293.66, 261.63, 293.66, 349.23, 0,
      293.66, 293.66, 349.23, 293.66, 392.00, 349.23, 293.66, 0
    ],
    bass: [73.42, 73.42, 87.31, 87.31, 73.42, 73.42, 65.41, 65.41],
    // "Слова" — свой текст в духе жанра, чтобы не копировать чужую лирику
    lyrics: [
      { beat: 0,  ru: 'Спаки, жуткий скелет', en: 'Spooky, scary skeleton' },
      { beat: 4,  ru: 'По спине холодок',     en: 'Shivers down your spine' },
      { beat: 8,  ru: 'Тени шепчут в ночи',   en: 'Shadows whisper tonight' },
      { beat: 12, ru: 'Хэллоуин близок',      en: 'Halloween is near' }
    ],
    voice: null,

    ensure: function () {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
        return true;
      }
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      } catch (e) { return false; }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
      this.voice = this.pickVoice();
      return true;
    },

    pickVoice: function () {
      if (!('speechSynthesis' in window)) return null;
      var vs = window.speechSynthesis.getVoices();
      // предпочитаем русский/английский голос
      for (var i = 0; i < vs.length; i++) {
        var v = vs[i];
        if (lang === 'ru' && v.lang && v.lang.indexOf('ru') === 0) return v;
        if (lang === 'en' && v.lang && v.lang.indexOf('en') === 0) return v;
      }
      return vs[0] || null;
    },

    note: function (freq, start, dur, type, vol) {
      if (!freq) return;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, start);
      g.gain.setValueAtTime(0.0001, start);
      g.gain.linearRampToValueAtTime(vol, start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      o.connect(g); g.connect(this.master);
      o.start(start); o.stop(start + dur + 0.05);
    },

    // короткий шумовой "стук костей" (кости)
    boneClick: function (start, vol) {
      var len = 0.05;
      var buffer = this.ctx.createBuffer(1, this.ctx.sampleRate * len, this.ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
      }
      var src = this.ctx.createBufferSource();
      src.buffer = buffer;
      var g = this.ctx.createGain();
      g.gain.value = vol;
      var f = this.ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 1200;
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(start);
    },

    speak: function (text) {
      if (!('speechSynthesis' in window) || !text) return;
      try {
        var u = new SpeechSynthesisUtterance(text);
        u.rate = 0.9;
        u.pitch = 0.4;      // низкий, "жуткий" голос
        u.volume = 0.55;
        if (this.voice) u.voice = this.voice;
        u.lang = (lang === 'ru') ? 'ru-RU' : 'en-US';
        window.speechSynthesis.speak(u);
      } catch (e) {}
    },

    tick: function () {
      if (!this.on || !this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
      var t = this.ctx.currentTime;
      var stepDur = 60 / this.bpm / 2;
      var i = this.step % this.melody.length;
      var m = this.melody[i];
      var b = this.bass[Math.floor(i / 2) % this.bass.length];

      // мелодия — короткое стаккато
      if (m) this.note(m, t, stepDur * 0.85, 'triangle', 0.13);
      // "кость" на каждом шаге — ритм щелчков
      this.boneClick(t, 0.10);
      // бас
      if (i % 2 === 0) this.note(b, t, stepDur * 1.5, 'sawtooth', 0.07);
      // "колокольчик" на сильных долях
      if (i % 8 === 0 && m) this.note(m * 2, t, 1.0, 'sine', 0.05);

      // Вокальная партия — на определённых шагах
      for (var k = 0; k < this.lyrics.length; k++) {
        if (this.lyrics[k].beat === i) {
          var line = (lang === 'ru') ? this.lyrics[k].ru : this.lyrics[k].en;
          this.speak(line);
        }
      }

      this.step++;
    },

    start: function () {
      if (!this.ensure()) return;
      if (this.timer) return;
      this.on = true;
      this.voice = this.pickVoice();
      var self = this;
      this.tick();
      this.timer = setInterval(function () { self.tick(); }, 60000 / this.bpm / 2);
      el.musicToggle.classList.add('playing');
      el.musicIcon.textContent = '🎵';
      el.musicLabel.textContent = LANG[lang].musicOn;
    },

    stop: function () {
      this.on = false;
      if (this.timer) { clearInterval(this.timer); this.timer = null; }
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      el.musicToggle.classList.remove('playing');
      el.musicIcon.textContent = '🔇';
      el.musicLabel.textContent = LANG[lang].musicOff;
    },

    blip: function (f1, f2, vol, type) {
      if (!this.ctx) return;
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(function () {});
      try {
        var t = this.ctx.currentTime;
        var o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(f1, t);
        o.frequency.exponentialRampToValueAtTime(f2, t + 0.18);
        g.gain.setValueAtTime(vol, t);
        g.gain.linearRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(this.master || this.ctx.destination);
        o.start(t); o.stop(t + 0.22);
      } catch (e) {}
    },
    catchSfx: function () { this.blip(600, 120, 0.14); },
    bonusSfx: function () { this.blip(880, 1320, 0.10, 'sine'); },
    cursedSfx: function () { this.blip(200, 50, 0.16, 'sawtooth'); }
  };

  if (el.musicToggle) el.musicToggle.addEventListener('click', function () {
    if (music.on) music.stop(); else music.start();
  });

  /* ================== ФИШКА 1: ФОНАРЬ ЗА КУРСОРОМ ================== */
  var torch = document.createElement('div');
  torch.style.cssText = 'position:fixed;pointer-events:none;z-index:5;width:260px;height:260px;border-radius:50%;' +
    'background:radial-gradient(circle,rgba(255,160,60,.10),transparent 65%);' +
    'transform:translate(-50%,-50%);transition:opacity .3s;opacity:0;mix-blend-mode:screen;';
  document.body.appendChild(torch);
  document.addEventListener('mousemove', function (e) {
    torch.style.left = e.clientX + 'px';
    torch.style.top = e.clientY + 'px';
    torch.style.opacity = 1;
  });
  document.addEventListener('mouseleave', function () { torch.style.opacity = 0; });

  /* ================== ФИШКА 2: ЛЕТУЧИЕ МЫШИ ================== */
  function spawnBat() {
    var bat = document.createElement('div');
    bat.textContent = '🦇';
    var startY = Math.random() * window.innerHeight * 0.6;
    var dir = Math.random() < 0.5 ? 1 : -1;
    var startX = dir === 1 ? -60 : window.innerWidth + 60;
    bat.style.cssText = 'position:fixed;z-index:6;pointer-events:none;font-size:' +
      (18 + Math.random() * 16) + 'px;top:' + startY + 'px;left:' + startX + 'px;' +
      'opacity:.85;transition:transform 8s linear, left 8s linear, top 8s linear;' +
      'filter:drop-shadow(0 0 6px rgba(255,98,0,.5));';
    document.body.appendChild(bat);
    // запуск анимации
    requestAnimationFrame(function () {
      bat.style.transform = 'scaleX(' + dir + ')';
      bat.style.left = (dir === 1 ? window.innerWidth + 60 : -60) + 'px';
      bat.style.top = (startY + (Math.random() * 200 - 100)) + 'px';
    });
    setTimeout(function () { if (bat.parentNode) bat.parentNode.removeChild(bat); }, 8200);
  }
  setInterval(function () { if (Math.random() < 0.7) spawnBat(); }, 18000);

  /* ================== ФИШКА 3: КОСТЯНОЙ ДОЖДЬ ПРИ КОМБО x5 ================== */
  var boneRainUsed = false;
  function boneRain() {
    for (var i = 0; i < 18; i++) {
      (function (idx) {
        setTimeout(function () {
          var b = document.createElement('div');
          b.textContent = Math.random() < 0.5 ? '🦴' : '💀';
          var x = Math.random() * window.innerWidth;
          b.style.cssText = 'position:fixed;z-index:7;pointer-events:none;font-size:' +
            (14 + Math.random() * 14) + 'px;left:' + x + 'px;top:-30px;' +
            'transition:top 1.6s ease-in, transform 1.6s linear, opacity 1.6s;';
          document.body.appendChild(b);
          requestAnimationFrame(function () {
            b.style.top = (window.innerHeight + 40) + 'px';
            b.style.transform = 'rotate(' + (Math.random() * 720 - 360) + 'deg)';
          });
          setTimeout(function () { if (b.parentNode) b.parentNode.removeChild(b); }, 1700);
        }, idx * 60);
      })(i);
    }
  }

  /* ================== ИГРА ================== */
  var active = false, gameLoop = null, timerLoop = null, specialTimer = null;
  var score = 0, best = 0, timeLeft = 30;
  var combo = { count: 0, max: 0, last: 0 };
  var pState = 'normal';

  try { var sb = localStorage.getItem('mz_halloween_best'); if (sb) best = parseInt(sb, 10) || 0; } catch (e) {}
  if (el.best) el.best.textContent = best;

  function arenaSize() {
    if (!el.arena) return { w: 300, h: 150 };
    return { w: Math.max(10, el.arena.clientWidth - 50), h: Math.max(10, el.arena.clientHeight - 50) };
  }
  function movePumpkin() {
    if (!active || !el.pumpkin) return;
    var s = arenaSize();
    el.pumpkin.style.left = Math.floor(Math.random() * s.w) + 'px';
    el.pumpkin.style.top = Math.floor(Math.random() * s.h) + 'px';
  }
  function setState(st) {
    pState = st;
    if (!el.pumpkin) return;
    el.pumpkin.classList.remove('bonus', 'cursed');
    if (st === 'bonus') { el.pumpkin.classList.add('bonus'); el.pumpkin.textContent = '🕷️'; }
    else if (st === 'cursed') { el.pumpkin.classList.add('cursed'); el.pumpkin.textContent = '👿'; }
    else el.pumpkin.textContent = '🎃';
  }
  function scheduleSpecial() {
    clearTimeout(specialTimer);
    if (!active) return;
    specialTimer = setTimeout(function () {
      if (!active) return;
      var r = Math.random();
      if (r < 0.35) setState('bonus');
      else if (r < 0.55) setState('cursed');
      else setState('normal');
      scheduleSpecial();
    }, 2500 + Math.random() * 3000);
  }
  function updateScore() {
    if (el.score) el.score.textContent = score;
    if (score > best) {
      best = score;
      if (el.best) el.best.textContent = best;
      try { localStorage.setItem('mz_halloween_best', best); } catch (e) {}
    }
  }
  function evalAch() {
    var t = LANG[lang];
    if (score >= 10 && el.ach1) { el.ach1.textContent = t.ach1on; el.ach1.classList.add('on'); }
    if (score >= 25 && el.ach2) { el.ach2.textContent = t.ach2on; el.ach2.classList.add('on'); }
    if (combo.max >= 5 && el.ach3) { el.ach3.textContent = t.ach3on; el.ach3.classList.add('on'); }
  }
  function updateCombo() {
    if (!el.combo) return;
    if (combo.count >= 2) { el.combo.textContent = 'Комбо x' + combo.count + '!'; el.combo.classList.add('show'); }
    else el.combo.classList.remove('show');
  }
  function registerClick() {
    var n = Date.now();
    if (n - combo.last < 900) combo.count++; else combo.count = 1;
    combo.last = n;
    if (combo.count > combo.max) combo.max = combo.count;
    updateCombo();
    if (combo.count >= 5 && !boneRainUsed) { boneRainUsed = true; boneRain(); }
  }
  function resetUI() {
    score = 0; timeLeft = 30; boneRainUsed = false;
    combo = { count: 0, max: 0, last: 0 };
    if (el.score) el.score.textContent = '0';
    if (el.timer) el.timer.textContent = '30';
    if (el.combo) { el.combo.textContent = ''; el.combo.classList.remove('show'); }
    var t = LANG[lang];
    if (el.ach1) { el.ach1.textContent = t.ach1; el.ach1.classList.remove('on'); }
    if (el.ach2) { el.ach2.textContent = t.ach2; el.ach2.classList.remove('on'); }
    if (el.ach3) { el.ach3.textContent = t.ach3; el.ach3.classList.remove('on'); }
  }
  function stopGame() {
    active = false;
    if (gameLoop) { clearInterval(gameLoop); gameLoop = null; }
    if (timerLoop) { clearInterval(timerLoop); timerLoop = null; }
    clearTimeout(specialTimer); specialTimer = null;
    setState('normal');
    if (el.pumpkin) { el.pumpkin.style.left = '45%'; el.pumpkin.style.top = '35%'; }
  }
  function startGame() {
    stopGame();
    resetUI();
    active = true;
    setState('normal');
    movePumpkin();
    gameLoop = setInterval(movePumpkin, 750);
    timerLoop = setInterval(function () {
      timeLeft--;
      if (el.timer) el.timer.textContent = timeLeft;
      if (timeLeft <= 0) { stopGame(); evalAch(); }
    }, 1000);
    scheduleSpecial();
  }
  if (el.startBtn) el.startBtn.addEventListener('click', startGame);
  if (el.stopBtn) el.stopBtn.addEventListener('click', stopGame);

  if (el.pumpkin) el.pumpkin.addEventListener('click', function () {
    if (!active) return;
    registerClick();
    if (pState === 'bonus') { score += 3; music.bonusSfx(); setState('normal'); }
    else if (pState === 'cursed') { score = Math.max(0, score - 2); music.cursedSfx(); setState('normal'); }
    else { score += 1; music.catchSfx(); }
    updateScore();
    evalAch();
    movePumpkin();
  });

  window.addEventListener('resize', function () {
    if (!active || !el.pumpkin) return;
    var s = arenaSize();
    var x = parseFloat(el.pumpkin.style.left) || 0;
    var y = parseFloat(el.pumpkin.style.top) || 0;
    if (x > s.w) el.pumpkin.style.left = s.w + 'px';
    if (y > s.h) el.pumpkin.style.top = s.h + 'px';
  });

  /* На случай, если голоса подгружаются асинхронно */
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function () { music.voice = music.pickVoice(); };
  }

  applyLang();
})();
</script>
